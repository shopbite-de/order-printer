imports:
    - { resource: 'services/shopware.yaml' }
    - { resource: 'services/escpos.yaml' }

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # CLI COMMANDS
    Veliu\OrderPrinter\Adapter\Command\PrintOrderCommand: ~
    Veliu\OrderPrinter\Adapter\Command\PrinterCheckCommand: ~
    Veliu\OrderPrinter\Adapter\Command\PrinterTestCommand: ~

    Veliu\OrderPrinter\Infra\Symfony\Scheduler\OpenOrderProvider: ~

    # MESSAGE HANDLER
    Veliu\OrderPrinter\Domain\Command\PrintOrderHandler: ~
    Veliu\OrderPrinter\Domain\Command\PrintOpenOrdersHandler: ~
    Veliu\OrderPrinter\Domain\Command\PurgeReceiptsHandler: ~

    # Logs retried / permanently failed print jobs with their order number
    Veliu\OrderPrinter\Infra\Symfony\Messenger\PrintOrderFailedListener: ~

    # MONITORING (docs/monitoring.md)
    Veliu\OrderPrinter\Infra\Monitoring\SendHeartbeatHandler: ~

    # Symfony's built-in logger, but as JSON lines on stderr from LOG_LEVEL up (default notice),
    # so OpenObserve gets the level right. Without this it logs plain text from "error" up only.
    Veliu\OrderPrinter\Infra\Symfony\Log\JsonLogFormatter: ~
    logger:
        class: Symfony\Component\HttpKernel\Log\Logger
        arguments:
            - '%env(LOG_LEVEL)%'
            - 'php://stderr'
            - '@Veliu\OrderPrinter\Infra\Symfony\Log\JsonLogFormatter'
