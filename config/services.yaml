imports:
    - { resource: 'services/shopware.yaml' }
    - { resource: 'services/escpos.yaml' }

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # CLI COMMANDS
    Veliu\OrderPrinter\Adapter\Command\PrintOrderCommand: ~
    Veliu\OrderPrinter\Adapter\Command\PrinterCheckCommand: ~
    Veliu\OrderPrinter\Adapter\Command\PrinterTestCommand: ~

    Veliu\OrderPrinter\Infra\Symfony\Scheduler\OpenOrderProvider: ~

    # MESSAGE HANDLER
    Veliu\OrderPrinter\Domain\Command\PrintOrderHandler: ~
    Veliu\OrderPrinter\Domain\Command\PrintOpenOrdersHandler: ~

    # Logs retried / permanently failed print jobs with their order number
    Veliu\OrderPrinter\Infra\Symfony\Messenger\PrintOrderFailedListener: ~
