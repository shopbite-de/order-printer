; Runs the two Messenger consumers in the foreground. Both log to the container's
; stdout/stderr so Dokploy / OpenObserve see them. --time-limit restarts each
; consumer hourly (memory hygiene); supervisor starts it again immediately.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Lets "supervisorctl status|restart <program>" work inside the container (docker compose exec).
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:scheduler]
command=php /app/bin/console messenger:consume scheduler_default --time-limit=3600 --no-interaction
directory=/app
user=app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=php /app/bin/console messenger:consume async --time-limit=3600 --no-interaction
directory=/app
user=app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
